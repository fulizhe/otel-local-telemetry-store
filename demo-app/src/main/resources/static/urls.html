<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试入口 · otel-local-telemetry-store</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#9aa3b2; --accent:#6ea8fe; --ok:#57d38c;
    --warn:#e8b64c; --err:#f0736a; --pending:#7d8595;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { padding:20px 28px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { margin:0 0 6px; font-size:18px; }
  .sub { color:var(--dim); font-size:13px; }
  .sub a { color:var(--accent); text-decoration:none; }
  .wrap { max-width:1080px; margin:0 auto; padding:22px 28px 64px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:16px 18px; margin-bottom:16px; }
  .card h2 { margin:0 0 4px; font-size:14px; }
  .card p { margin:0 0 12px; color:var(--dim); font-size:12.5px; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .item { display:grid; grid-template-columns:64px minmax(220px,auto) 1fr auto;
          gap:10px; align-items:center; padding:8px 10px;
          background:var(--panel-2); border:1px solid var(--line); border-radius:8px; }
  .item .m { font-size:11px; font-weight:700; text-align:center; padding:2px 0;
             border-radius:4px; }
  .item .m.get { background:#12351f; color:var(--ok); }
  .item .m.post { background:#2c2440; color:#c6a6ff; }
  .item code { font-size:12.5px; color:var(--fg); background:none; overflow-wrap:anywhere; }
  .item .d { color:var(--dim); font-size:12.5px; }
  .item button { padding:6px 14px; cursor:pointer; border:0; border-radius:6px;
                 background:var(--accent); color:#08101f; font-weight:600; }
  .item button:disabled { opacity:.5; }
  .item .wrap-out { grid-column:1 / -1; }
  .out { display:none; margin:2px 0 0; padding:8px 10px; background:#0b0d11;
         border:1px solid var(--line); border-radius:6px; font:12px/1.5 ui-monospace,Consolas,monospace;
         white-space:pre-wrap; overflow-wrap:anywhere; max-height:240px; overflow:auto; }
  .out.on { display:block; }
  .out.err { border-color:var(--err); }
  .trace { grid-column:1 / -1; font-size:12.5px; }
  .trace a { color:var(--accent); }
  a.page { display:inline-flex; align-items:center; gap:6px; padding:6px 12px;
           background:var(--panel-2); border:1px solid var(--line); border-radius:999px;
           color:var(--fg); text-decoration:none; }
  a.page:hover { border-color:var(--accent); }
  .links { display:flex; flex-wrap:wrap; gap:8px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px;
          border:1px solid var(--line); color:var(--dim); }
  .pill.ok { color:var(--ok); border-color:#1d3a2a; }
  .pill.warn { color:var(--warn); border-color:#3a3320; }
</style>
</head>
<body>
<header>
  <h1>测试入口（黄页）</h1>
  <div class="sub">
    靶子端点的可视化入口 —— 点按钮即发请求，<b>不用记 URL、不用 curl</b>。
    <a href="index.html">← 回控制台</a>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>依赖五跳 <span class="pill" id="deps-pill">加载中…</span></h2>
    <p>每点一次是真的发一次客户端调用，span 由 agent 的仪表化产生（代码里没有自己开 span）。
       打完打开 <a href="#" id="topo-link">拓扑页</a> → 点「刷新」看边。</p>
    <div id="deps" class="list"></div>
  </div>

  <div class="card">
    <h2>依赖就绪状态</h2>
    <p>探测只在启动时做一次；<code>ready=false</code> 的那一项不会出现在拓扑图上。</p>
    <div id="status"><span style="color:var(--dim)">加载中…</span></div>
  </div>

  <div class="card">
    <h2>信号</h2>
    <p>三条信号线的快速入口（带默认参数）。要改参数去 <a href="index.html">控制台</a>。</p>
    <div id="signals" class="list"></div>
  </div>

  <div class="card">
    <h2>读到哪去看 <span class="pill" id="readout-pill">读取中…</span></h2>
    <p>读口在另一个端口（默认 17890，被占会退让）。开新标签页读 —— 读口不开 CORS。</p>
    <div id="readout" class="links"><span style="color:var(--dim)">加载中…</span></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let readoutBase = null;

const DEPS = [
  ['h2', 'H2 那一跳（表 demo_h2_order）'],
  ['redis', 'Redis 那一跳（Jedis SET/GET/DEL）'],
  ['kafka', 'Kafka 那一跳（producer + consumer）'],
  ['grpc', 'gRPC 那一跳（client + server）'],
  ['mysql', 'MySQL 那一跳（表 demo_mysql_order）'],
];
const SIGNALS = [
  ['POST', '/demo/spans?count=3&childPerSpan=2', '3 条父 span，各挂 2 个子 span'],
  ['POST', '/demo/logs?count=5&level=INFO', '5 行带 trace 上下文的日志'],
  ['POST', '/demo/metrics?count=10', '10 个指标点（计数器 + 直方图）'],
  ['GET', '/demo/work?ms=30', '经 agent 的 Web 仪表化产生 server span'],
  ['GET', '/demo/stats', '本应用自造的计数（对账用）'],
  ['POST', '/demo/reset', '清零计数'],
];
const PAGES = [
  ['index.html', '索引'], ['traces.html', 'span'], ['logs.html', '日志'],
  ['metrics.html', '指标'], ['topology.html', '拓扑'],
  ['self.html', '自监控'], ['self-log.html', '自日志'],
];

function item(method, path, desc) {
  return `<div class="item">
    <span class="m ${method.toLowerCase()}">${method}</span>
    <code>${path}</code>
    <span class="d">${desc || ''}</span>
    <button onclick="run(this, '${method}', '${path}')">打一次</button>
    <span class="trace"></span>
    <pre class="out wrap-out"></pre>
  </div>`;
}

function render() {
  $('deps').innerHTML =
    DEPS.map(([k, d]) => item('POST', '/demo/deps/' + k, d)).join('')
    + item('POST', '/demo/deps/all', '一次打穿五跳，返回 traceId（端到端验收主路径）');
  $('signals').innerHTML = SIGNALS.map(([m, p, d]) => item(m, p, d)).join('');
}

async function run(btn, method, path) {
  const it = btn.closest('.item');
  const out = it.querySelector('.out');
  const trace = it.querySelector('.trace');
  btn.disabled = true;
  out.textContent = '请求中…'; out.className = 'out wrap-out on';
  trace.innerHTML = '';
  try {
    const r = await fetch(path, { method });
    const text = await r.text();
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { /* 非 JSON 原样 */ }
    out.textContent = 'HTTP ' + r.status + '\n' + pretty;
    out.className = 'out wrap-out on' + (r.ok ? '' : ' err');
    showTrace(trace, text);
  } catch (e) {
    out.textContent = '失败：' + e;
    out.className = 'out wrap-out on err';
  } finally {
    btn.disabled = false;
  }
}

function showTrace(host, text) {
  let tid = '';
  try { const j = JSON.parse(text); tid = j.traceId || (j.result && j.result.traceId) || ''; } catch (e) {}
  if (!tid || !readoutBase) { return; }
  host.innerHTML = 'traceId <code>' + tid + '</code> ·'
    + ' <a target="_blank" rel="noopener" href="' + readoutBase + 'traces.html?traceId='
    + encodeURIComponent(tid) + '">看这条 trace</a>'
    + ' · <a target="_blank" rel="noopener" href="' + readoutBase + 'topology.html">看拓扑</a>';
}

async function loadStatus() {
  try {
    const r = await (await fetch('/demo/deps/status')).json();
    $('deps-pill').textContent = r.readyCount + '/' + r.totalCount + ' 就绪';
    $('deps-pill').className = 'pill ' + (r.readyCount === r.totalCount ? 'ok' : 'warn');
    $('status').innerHTML = '<table><thead><tr><th>依赖</th><th>embedded</th>'
      + '<th>ready</th><th>detail</th></tr></thead><tbody>'
      + (r.dependencies || []).map(d =>
          '<tr><td><code>' + d.key + '</code></td><td>' + d.embedded + '</td>'
          + '<td>' + (d.ready ? '<span class="pill ok">true</span>' : '<span class="pill warn">false</span>')
          + '</td><td style="color:var(--dim)">' + (d.detail || '') + '</td></tr>').join('')
      + '</tbody></table>';
  } catch (e) {
    $('status').innerHTML = '<span style="color:var(--err)">读取失败：' + e + '</span>';
  }
}

async function loadReadout() {
  try {
    const r = await (await fetch('/demo/readout')).json();
    const box = $('readout');
    if (!r.found) {
      $('readout-pill').textContent = '没找到读口';
      $('readout-pill').className = 'pill warn';
      box.innerHTML = '<span style="color:var(--dim)">' + (r.detail || '') + '</span>';
      return;
    }
    readoutBase = r.url.endsWith('/') ? r.url : r.url + '/';
    $('readout-pill').textContent = '端口 ' + r.port;
    $('readout-pill').className = 'pill ok';
    $('topo-link').href = readoutBase + 'topology.html';
    box.innerHTML = PAGES.map(([p, t]) =>
      '<a class="page" target="_blank" rel="noopener" href="' + readoutBase + p + '">' + t + '</a>').join('');
  } catch (e) {
    $('readout-pill').textContent = '读取失败';
    $('readout').innerHTML = '<span style="color:var(--err)">' + e + '</span>';
  }
}

render();
loadStatus();
loadReadout();
setInterval(loadStatus, 3000);
</script>
</body>
</html>
