server:
  #18080 常被本机的其它服务占用（本项目写作时那里跑着 RuoYi-Flowable-Plus），故退到 18081。
  # 撞端口时 Spring 会直接启动失败，不会自动退让 —— 演示环境手动改这里即可。
  port: 18081
  shutdown: graceful

spring:
  application:
    name: otel-local-telemetry-store-demo
  main:
    # 关掉 banner，免得它混进我们要读的日志里
    banner-mode: off
  mvc:
    problemdetails:
      enabled: false

logging:
  level:
    root: INFO
    io.github.fulizhe.otelstore.demo: INFO
    # 内嵌 Kafka / ZooKeeper 在 INFO 下会刷掉大量日志，把验收信号（agent 的
    # 「已注册三条采集管线」与退出汇总行）埋掉。它们的状态我们自己会报进
    # /demo/deps/status，所以只需要它们的 WARN 以上。
    kafka: WARN
    org.apache.kafka: WARN
    org.apache.zookeeper: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n"